<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>for you ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 40%, #142347 0%, #0b1226 40%, #060a16 100%);
      color: #f5f1e8;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    /* subtle background glow */

    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #5269b8;
      filter: blur(180px);
      opacity: 0.08;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: opacity 2s ease;
    }

    /* first screen */

    .intro {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      transition:
        opacity 1.2s ease,
        transform 1.2s ease;
    }

    .intro-content {
      opacity: 0;
      transform: translateY(20px);
      animation: introFade 1.8s ease forwards;
    }

    .hello {
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 500;
      margin-bottom: 35px;
    }

    .click-text {
      font-size: 1rem;
      color: #aeb8d0;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .eyes {
      border: none;
      background: transparent;
      color: white;
      font-size: 3rem;
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 20px;

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        filter 0.3s ease;
    }

    .eyes:hover {
      transform: scale(1.15);
      background: rgba(143, 168, 255, 0.08);
      filter: drop-shadow(0 0 15px rgba(143, 168, 255, 0.35));
    }

    .eyes:active {
      transform: scale(0.95);
    }

    /* confession screen */

    .confession {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 35px 25px;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
    }

    .confession.show {
      opacity: 1;
      visibility: visible;
    }

    .letter {
      width: min(700px, 100%);
      max-height: 85vh;
      overflow-y: auto;

      text-align: center;
      padding: 30px;

      scrollbar-width: none;
    }

    .letter::-webkit-scrollbar {
      display: none;
    }

    .typing {
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      line-height: 2;
      color: #e9e8e3;
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #8fa8ff;
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    .heart {
      margin-top: 45px;
      font-size: 1.8rem;
      opacity: 0;
      transition: opacity 2s ease;
      color: #d9defa;
    }

    .heart.show {
      opacity: 1;
    }

    /* animations */

    @keyframes introFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }

    /* mobile */

    @media (max-width: 600px) {

      .hello {
        font-size: 2.3rem;
      }

      .click-text {
        font-size: 0.9rem;
      }

      .eyes {
        font-size: 2.7rem;
      }

      .letter {
        padding: 20px 12px;
      }

      .typing {
        font-size: 1rem;
        line-height: 1.9;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <!-- FIRST SCREEN -->

  <main class="intro" id="intro">

    <div class="intro-content">

      <div class="hello">
        hi lol 😳😳
      </div>

      <div class="click-text">
        ↓ anyways click this ↓
      </div>

      <button class="eyes" id="eyes" aria-label="click me">
        👀👀
      </button>

    </div>

  </main>


  <!-- CONFESSION -->

  <section class="confession" id="confession">

    <div class="letter">

      <div class="typing" id="typing"></div>
      <span class="cursor" id="cursor"></span>

      <div class="heart" id="heart">
        ♡
      </div>

    </div>

  </section>


  <script>

    const eyes = document.getElementById("eyes");
    const intro = document.getElementById("intro");
    const confession = document.getElementById("confession");
    const typing = document.getElementById("typing");
    const cursor = document.getElementById("cursor");
    const heart = document.getElementById("heart");
    const glow = document.querySelector(".glow");


    /*
      CHANGE THIS TEXT TO WHATEVER
      YOU WANT HER TO READ
    */

    const message = `okay...

i've actually been wanting to tell you this for a while.

i don't really know how to say it without making it sound cheesy, so i'll just be honest.

you've become someone who's genuinely really special to me.

talking to you, laughing with you, and even the random little conversations mean more to me than you probably realize.

somehow, you became one of those people i actually look forward to hearing from.

and honestly...

i like you.

a lot.

i don't expect you to say anything right away, and i don't want you to feel pressured at all.

i just wanted you to know how i feel, because you deserve to hear it from me.

thank you for being you.`;


    /*
      WHEN 👀👀 IS CLICKED
    */

    eyes.addEventListener("click", () => {

      // Fade out the first screen
      intro.style.opacity = "0";
      intro.style.transform = "scale(0.96)";

      // Make the glow slightly warmer/stronger
      glow.style.opacity = "0.14";

      setTimeout(() => {

        intro.style.display = "none";

        // Show confession
        confession.classList.add("show");

        // Start typing after the fade
        setTimeout(() => {
          typeText();
        }, 700);

      }, 1200);

    });


    /*
      TYPING ANIMATION
    */

    let index = 0;

    function typeText() {

      if (index < message.length) {

        typing.textContent += message.charAt(index);

        index++;

        /*
          Change this number to control
          typing speed.

          25 = fast
          45 = normal
          70 = slow
        */

        setTimeout(typeText, 38);

      } else {

        // Remove blinking cursor
        setTimeout(() => {
          cursor.style.display = "none";
          heart.classList.add("show");
        }, 700);

      }

    }

  </script>

</body>
